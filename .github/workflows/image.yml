name: Worker image

# Builds the worker image from scratch and runs the tests that only run inside it (TM_IN_IMAGE=1): the self-check, the
# Playwright `image` project (launch, frames, the real desk pause) and the recorder integration test.
on:
  pull_request:
    paths:
      - 'docker/worker/**'
      - 'docker/egress/**'
      - 'packages/worker/**'
      - 'packages/core/**'
      - 'scripts/build-worker-image.sh'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The image is about 4 GB and its build runs bun install; the runner's preinstalled SDKs make room for both.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the worker image
        run: sh scripts/build-worker-image.sh
      - name: Self-check
        run: docker run --rm tm-worker:dev selfcheck
      - name: Image specs
        run: docker run --rm --shm-size=2g tm-worker:dev test --project=image
      - name: Recorder integration test
        run: docker run --rm --shm-size=2g tm-worker:dev unit packages/worker/test/image/recorder.int.test.ts
