<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canteen feedback</title>
    <style>
      [hidden] { display: none !important }
      [role='button'], [role='option'], button { cursor: pointer; padding: 4px }
    </style>
  </head>
  <body>
    <div id="app">
      <div data-automation-id="formTitle">Canteen feedback</div>
      <div data-automation-id="formDescription">Tell us what you think of the canteen.</div>
      <div data-automation-id="userEmail">student@example.edu.my</div>
      <div data-automation-id="respondentNotice">Hi, Test Student. When you submit this form, the owner will see your name and email address.</div>
      <div class="page"><div data-automation-id="questionItem"><span data-automation-id="questionTitle">Your comments</span><textarea></textarea></div><button type="button" data-automation-id="submitButton">Submit</button></div>
    </div>

    <script src="fixture.js"></script>
  </body>
</html>
