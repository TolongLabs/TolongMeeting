<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Week 5 attendance quiz</title>
    <style>
      [hidden] { display: none !important }
      [role='button'], [role='option'], button { cursor: pointer; padding: 4px }
    </style>
  </head>
  <body>
    <div id="app">
      <div data-automation-id="formTitle">Week 5 attendance quiz</div>
      
      <div data-automation-id="userEmail">student@example.edu.my</div>
      <div data-automation-id="respondentNotice">Hi, Test Student. When you submit this form, the owner will see your name and email address.</div>
      <div class="page"><div data-automation-id="questionItem"><span data-automation-id="questionTitle">Full name</span><input data-automation-id="textInput" type="text"></div><div data-automation-id="questionItem"><span data-automation-id="questionTitle">Which week is it? <span aria-label="Required">*</span></span><div class="points">(1 point)</div><label><input type="radio" name="q5" value="Week 4"> <span>Week 4</span></label><label><input type="radio" name="q5" value="Week 5"> <span>Week 5</span></label></div><div data-automation-id="questionItem"><span data-automation-id="questionTitle">Is this a quiz? <span aria-label="Required">*</span></span><div class="points">(1 point)</div><label><input type="radio" name="q6" value="Yes"> <span>Yes</span></label><label><input type="radio" name="q6" value="No"> <span>No</span></label></div><button type="button" data-automation-id="submitButton">Submit</button></div><div class="copy"><label><input type="checkbox" aria-label="Send me an email receipt of my responses"> Send me an email receipt of my responses</label></div>
    </div>
    
    <script src="fixture.js"></script>
  </body>
</html>
