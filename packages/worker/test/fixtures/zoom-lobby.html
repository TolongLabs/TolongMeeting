<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zoom meeting on web</title>
    <script src="fixture.js"></script>
  </head>
  <body>
    <p id="status">Please wait, the meeting host will let you in soon.</p>
    <script>
      const params = new URLSearchParams(location.search)
      const status = document.getElementById('status')
      if (params.has('admit')) {
        setTimeout(() => {
          location.href = 'zoom-meeting-top.html'
        }, Number(params.get('admit')))
      }
      if (params.has('deny')) {
        setTimeout(() => {
          status.textContent = 'You have been removed from the waiting room'
        }, Number(params.get('deny')))
      }
      if (params.has('end')) {
        setTimeout(() => {
          status.textContent = 'This meeting has been ended by host'
        }, Number(params.get('end')))
      }
    </script>
  </body>
</html>
